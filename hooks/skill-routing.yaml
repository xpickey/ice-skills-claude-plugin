# ตารางเส้นทาง skill ของทีม iCE — จุดแก้จุดเดียว (V01R03 · 2026.09.05 — V01R02 เพิ่ม ice-writing-register · V01R03 เพิ่มกติกาการจับคู่จากผลทดสอบผู้อ่านสด)
#
# ไฟล์นี้คืออะไร: ตารางที่บอกว่า "งานแบบไหน ต้องโหลด skill อะไร ก่อนเริ่มคิด" เครื่องเป็นคนอ่านไฟล์นี้
# ไม่ใช่ตัว model — hook อ่านทุกครั้งที่ user พิมพ์ข้อความ แล้วเพิ่มคำสั่งโหลด skill เข้าบริบทของ Claude ให้เอง
# ผู้ใช้ตารางนี้: hooks/ice-skill-router.py (เพิ่มคำสั่งเข้าบริบท) · hooks/ice-spec-gate.py (ปฏิเสธการเขียน spec ถ้ายังไม่โหลด)
#                · hooks/ice-prebuild-guard.sh (ปฏิเสธ build ถ้ายังไม่โหลด) · สคริปต์ deploy (สร้าง skills: preload ให้ agent)
#
# วิธีเพิ่มแถว: คัดลอกแถวใดแถวหนึ่ง แก้ id/when/required แล้วรัน  python3 hooks/tests/test_router.py  ต้องผ่านทุกข้อ
# ความหมายของช่อง:
#   id          รหัสเส้นทาง (ภาษาอังกฤษ ไม่ซ้ำ)
#   when.any_of คำที่ถ้าพบในข้อความของ user (ไม่สนตัวพิมพ์เล็กใหญ่) ถือว่าเข้าเส้นทางนี้
#   when.path   รูปแบบโฟลเดอร์ที่ทำงานอยู่ (fnmatch) — ถ้ามีทั้ง any_of และ path ต้องตรงอย่างน้อยหนึ่งอย่าง
#   required    skill ที่ต้องโหลดก่อนเขียน spec หรือ build — hook ปฏิเสธถ้ายังไม่โหลด (โหลดผ่าน Skill tool หรือ Read ไฟล์ SKILL.md ของ skill นั้น)
#   recommended skill ที่ควรโหลด hook แนะนำแต่ไม่ปฏิเสธ
#   read_first  ไฟล์ที่ต้องเปิดอ่านก่อนออกแบบ (นับว่าอ่านแล้วเมื่อมี Read ไฟล์นั้นใน session)
#   card        ไฟล์กฎสั้น ๆ ที่ hook นำเนื้อหาทั้งไฟล์ใส่เข้าบริบทของ Claude ทันที (ใช้กับกฎที่ user ย้ำบ่อย)
#   note        ข้อความสั้นเพิ่มเติมที่ hook แสดงต่อท้าย
#
# กติกาการจับคู่และการนับ (แก้ตามผลทดสอบผู้อ่านสด 2026.09.05):
#   - คำใน any_of ที่เป็นอังกฤษล้วนจับแบบทั้งคำ (word ไม่ตรงกับ keyword) · คำที่มีอักษรไทยจับแบบข้อความย่อย (เสนอ ตรงกับ นำเสนอ ได้)
#   - ข้อความหนึ่งเข้าได้หลายประเภทพร้อมกัน → รวม required/recommended/read_first ของทุกประเภทที่ตรง (union) ไม่เลือกเพียงหนึ่ง
#   - ไม่เข้าประเภทใดเลย → ไม่มี required · hook จะขอให้ model ประกาศในคำตอบแรกว่าจะใช้ skill ตระกูลใด และบันทึกลง ~/.claude/state/ice-session/no-route.log เพื่อเพิ่มแถวภายหลัง
#   - "โหลดแล้ว" นับเฉพาะใน session หลักที่ user คุยด้วย (สภาพ session แยกตาม session_id) — subagent โหลดแทนไม่นับ
#   - skill ใน required/recommended ต้องมีอยู่จริงที่ ~/.claude/skills/<ชื่อ>/SKILL.md — hooks/tests/test_router.py ตรวจข้อนี้ทุกครั้ง
#   - card ใส่ได้หลายไฟล์ (hook นำแต่ละไฟล์เข้าบริบทครั้งเดียว) · path ที่ขึ้นต้น ~ hook ขยายให้เอง · path ของ hooks/… เทียบจากรากของ repo ไฟล์นี้
#   - ช่องที่ไม่มีค่า ให้ละทั้งบรรทัด (ห้ามปล่อยช่องว่างเปล่า)

routes:

  - id: deck-customer
    label: งานสไลด์นำเสนอหรือข้อเสนอที่ลูกค้าจะเห็น
    when:
      any_of: [pptx, deck, slide, สไลด์, นำเสนอ, presentation, proposal, ข้อเสนอ, pitch, one page, one-page, infographic, อินโฟกราฟิก]
    required: [ice-doc-builder, b2b-slide-designer, ice-writing-register]
    recommended: [b2b-presentation-creator, ice-b2b-enterprise-sale, b2b-solution-selling]
    read_first:
      - ~/.claude/skills/b2b-slide-designer/references/pptx-design-doctrine.md
      - ~/.claude/skills/b2b-slide-designer/references/design-principles.md
    card: ~/.claude/skills/b2b-slide-designer/references/pptx-design-doctrine.md
    note: ทุกหน้าใน content-spec ต้องมีช่อง objective (ใช้ตอนคิดเท่านั้น ห้ามโผล่บนสไลด์) · action_title · key_message ตามงบคำ · visual · topic_id · color_set

  - id: doc-customer
    label: เอกสาร Word หรือ Excel ที่ลูกค้าจะเห็น (TOR · requirement workbook · work order · สัญญา · รายงาน)
    when:
      any_of: [docx, xlsx, word, excel, TOR, requirement, workbook, work order, สัญญา, รายงานประชุม, minutes, MOM, gap analysis, comply, ตอบ TOR]
    required: [ice-doc-builder, ice-writing-register]
    recommended: [ice-doc-reader, ice-b2b-enterprise-sale]
    note: อ่านเอกสารต้นทางของลูกค้าด้วย ice-doc-reader ก่อน แล้วสกัดศัพท์ที่ลูกค้าใช้จริงลง _build/glossary.md ก่อนเขียน spec

  - id: sales-thinking
    label: งานคิดเชิงขาย (discovery · qualify · MEDDPICC · account plan · pricing · negotiation · demo design)
    when:
      any_of: [discovery, qualify, MEDDPICC, account plan, win plan, pricing, ราคา, negotiat, เจรจา, objection, demo script, business case, fit-gap, fit gap, ตั้งคำถาม, questioning, pain]
    required: [ice-b2b-enterprise-sale]
    recommended: [b2b-questioning, b2b-solution-selling, b2b-enterprise-sale-strategy, b2b-why-thinking, competitor-objection-bank]

  - id: thai-translation
    label: ต้องแปลอังกฤษเป็นไทย หรือเขียนไทยจากต้นทางอังกฤษ
    when:
      any_of: [แปล, ภาษาไทย, ทับศัพท์, translate, thai wording, ภาษา business, ไม่ลิเก]
    required: [ice-writing-register]
    note: ไม่แน่ใจว่าคำไทยที่จะใช้เป็นคำที่วงการใช้จริง → ค้น internet ได้ทันทีโดยไม่ต้องขอ (ข้อยกเว้น H2 ที่ user อนุมัติ 2026.09.05) แล้วบันทึกคำและแหล่งลง _build/glossary.md

  - id: academic-article
    label: บทความวิชาการ วิจัย ดุษฎีนิพนธ์
    when:
      any_of: [บทความวิชาการ, บทความวิจัย, ดุษฎีนิพนธ์, วารสาร, TCI, มจร, APA, citation, อ้างอิง, ThaiJO, humanize, GPTZero, Turnitin]
      path: ["*/Academic/*", "*/Academic"]
    required: [thesis-ai-det-col, ice-writing-register]
    recommended: [soc-sci-academic-article, jpspa-academic-article, agj-academic-article, phd-mcu-pa-dissertation, research-compass-nrct]
    note: เลือก skill วารสารให้ตรงเล่ม (มจร สังคมศาสตร์ปริทรรศน์ = soc-sci · รัฐศาสตร์ AJPP/JPSPA = jpspa · AGJ = agj) — ไม่แน่ใจเล่มไหน ให้ถาม user ก่อน

  - id: product-netsuite
    label: งานที่เกี่ยวกับ Oracle NetSuite
    when:
      any_of: [NetSuite, SuiteScript, SuiteCloud, SDF, SuiteAnalytics]
      path: ["*NetSuite*", "*/NS-*", "*Netsuite*"]
    required: []
    recommended: [oracle-netsuite-consulting, ice-netsuite-thailand-advisory]

  - id: product-oracle-cloud
    label: งานที่เกี่ยวกับ Oracle Fusion Cloud ERP/EPM
    when:
      any_of: [Fusion, Oracle Cloud, ERP Cloud, EPM, OCI, FAH]
    required: []
    recommended: [oracle-cloud-applications-consulting]

  - id: product-ebs
    label: งานที่เกี่ยวกับ Oracle E-Business Suite
    when:
      any_of: [EBS, E-Business Suite, R12, 12.2]
    required: []
    recommended: [oracle-ebs-consulting]

  - id: govt-thailand
    label: งานภาครัฐไทย (GFMIS · e-GP · รัฐวิสาหกิจ · ระเบียบพัสดุ)
    when:
      any_of: [GFMIS, e-GP, eGP, รัฐวิสาหกิจ, ราชการ, ภาครัฐ, พัสดุ, e-bidding, กรมบัญชีกลาง]
    required: []
    recommended: [govt-egp-gfmis, advisor-govt-gfmis]

  - id: demo-app
    label: สร้างแอปสาธิตหรือ prototype ที่กดได้จริง
    when:
      any_of: [demo app, prototype, แอปสาธิต, POC, mockup, หน้าจอ, dashboard demo]
    required: [ice-demo-builder]
    recommended: [ice-b2b-enterprise-sale]
    note: กำกวมว่าเป็นเอกสารหรือแอป ให้ถาม user ก่อน ห้ามเดา

  - id: doc-reading
    label: อ่านหรือแปลงเอกสารต้นทาง (PDF · docx · xlsx · pptx) เป็น Markdown
    when:
      any_of: [อ่านไฟล์, อ่าน File, แปลงไฟล์, extract, OCR, สรุปเอกสาร, อ่านเอกสาร]
    required: []
    recommended: [ice-doc-reader]
